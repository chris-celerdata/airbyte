plugins {
    id 'application'
    id 'airbyte-bulk-connector'
    id "io.airbyte.gradle.docker"
    id 'airbyte-connector-docker-convention'
}

airbyteBulkConnector {
    core = 'load'
    toolkits = ['legacy-task-load-db']
    useLegacyTaskLoader = true
}

application {
    mainClass = 'io.airbyte.integrations.destination.starrocks.StarRocksDestination'

    applicationDefaultJvmArgs = [
            '-XX:+ExitOnOutOfMemoryError', '-XX:MaxRAMPercentage=75.0'
    ]
}

configurations.all {
    exclude group: "org.slf4j", module: "slf4j-reload4j"
}

dependencies {
    // MySQL JDBC driver (StarRocks uses MySQL protocol)
    implementation 'mysql:mysql-connector-java:8.0.33'

    // HTTP client (used for Stream Load writes and connectivity check in StarRocksChecker)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Logging
    implementation 'io.github.oshai:kotlin-logging-jvm:7.0.0'
}
